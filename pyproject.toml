[project]
name = "jupyter-book-template"
version = "0.1.0"
description = "Jupyter Book 2 template for MyST notebooks and GitHub Pages deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "altair[save]==6.2.2",
  "jupyter-book==2.1.6",
  "jupyterlab==4.6.3",
  "mapie==1.5.0",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pandera[mypy]==0.32.1",
  "pydantic-settings==2.15.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "seaborn==0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "nbqa==1.9.1",
  "poethepoet==0.48.0",
  "prek==0.5.0",
  "pylint==4.0.7",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.uv.build-backend]
module-name = [
  "core",
  "simulation",
  "analysis",
  "prediction",
  "visualization",
  "evaluation"
]

#########################
# Tasks
#########################

[tool.poe.tasks]
check = "prek run --all-files --verbose"

[tool.poe.tasks.build-book]
help = """
Build static HTML with executed notebooks
Related docs:
--execute: https://jupyterbook.org/stable/execution/execution/#execute-demo-content-at-build-time
--html: https://jupyterbook.org/stable/build-and-publish/publish/#custom-web-servers-and-other-static-hosts
--ci: Just a flag to indicate that this is a CI build
"""
cwd = "book"
cmd = "jupyter book build --html --execute --ci"

[tool.poe.tasks.serve-book-preview]
help = """
Preview the book locally
Related docs:
start: https://jupyterbook.org/stable/execution/execution/#start-jupyter-book
"""
cwd = "book"
cmd = "jupyter book start --port 8000"

[tool.poe.tasks.serve-book]
sequence = ["build-book", "serve-book-preview"]

[tool.poe.tasks.build-docker]
help = "Build the Binder Docker image (repo root context, .binder/Dockerfile)."
cmd = "docker build --no-cache --file .binder/Dockerfile --tag jupyter-book-template:binder ."

[tool.poe.tasks.ci]
sequence = ["check", { cmd = "pytest" }, "build-book"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-vv", "--cov", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.run]
branch = true
source_pkgs = [
  "core",
  "simulation",
  "analysis",
  "prediction",
  "visualization",
  "evaluation"
]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
  "^\\s*\\.\\.\\.$",
]

#########################
# MyPy
#########################

[tool.mypy]
strict = true
follow_imports = "normal"
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pandera.mypy"]
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
ignore_missing_imports = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = [
  "altair.*",
  "joblib.*",
  "matplotlib.*",
  "seaborn.*",
  "mapie.*",
  "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disable_error_code = ["no-any-unimported"]

# sklearn/mapie/altair return untyped Any; relax only for ML/visualization touchpoints.
[[tool.mypy.overrides]]
module = [
  "analysis.*",
  "prediction.*",
  "visualization.*",
  "evaluation.*",
  "core.features",
  "core.fourier_features",
  "simulation.generator",
]
disable_error_code = [
  "no-any-unimported",
  "no-any-return",
  "valid-type",
  "misc"
]

#########################
# RUFF
#########################

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true
line-length = 120
extend-exclude = ["_build"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["D"]
"src/**/__init__.py" = []
"tests/**" = ["D", "PLR2004", "B017", "RUF069"]
"book/**/*.ipynb" = ["D", "B018"]
"book/**/*_nbqa_*" = ["D", "B018"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "D203",                # incompatible with D211 (no-blank-line-before-class)
  "D213",                # incompatible with D212 (multi-line-summary-first-line)
  "D104",                # inconsistent docstring quotes
  "CPY",                 # copyright notices
  "S101",                # assert usage
  "ISC001",              # implicit string concat
  "ANN401",              # any type
  "COM812",              # trailing comma
  "E501",                # line too long (handled by formatter)
  "ARG002",              # unused method argument
  "DOC501",              # raised exception missing from docstring
  "DOC502",              # documented exception from inner function (API docs clarity)
  "N999",                # chapter notebooks use numeric ordering prefixes (e.g. 00_how_to_use.ipynb)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

#########################
# Pylint
#########################

[tool.pylint.main]
extension-pkg-allow-list = ["mypy"]

[tool.pylint.typecheck]
contextmanager-decorators = ["contextlib.contextmanager"]
ignore-none = true
ignore-on-opaque-inference = true
ignored-checks-for-mixins = [
  "no-member",
  "not-async-context-manager",
  "not-context-manager",
  "attribute-defined-outside-init",
]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local"]
missing-member-hint = true
missing-member-hint-distance = 1
missing-member-max-choices = 1
mixin-class-rgx = ".*[Mm]ixin"

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "invalid-name",                   # chapter notebooks use numeric ordering prefixes (e.g. 00_how_to_use.ipynb)
  "line-too-long",                  # handled by ruff format
  "import-error",                   # already validated by mypy
  "duplicate-code",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments",
  "redefined-outer-name",           # pytest fixture parameter names shadow outer fixtures
  "pointless-statement",            # notebook last-cell display (nbqa-pylint)
  "expression-not-assigned",        # notebook last-cell display (nbqa-pylint)
]

#########################
# Pymetrica
#########################

[tool.pymetrica]
exclude = []

#########################
# Tombi
#########################

[tool.tombi.files]
exclude = ["uv.lock"]

[tool.tombi.format.rules]
trailing-comment-alignment = true

[[tool.tombi.schemas]]
path = "https://json.schemastore.org/pyproject.json"
include = ["pyproject.toml"]

[tool.tombi.schemas.format.rules.table-keys-order]
enabled = false
